<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>KC | Portfolio</title>


    <style>
        /* Basic page styling */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
        }


        /* Navigation bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #181818;
        }


        nav .logo {
            font-size: 24px;
            font-weight: bold;
        }


        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }


        nav a:hover {
            opacity: 0.7;
        }


        /* Main hero section */
        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }


        .hero h1 {
            font-size: 64px;
            margin: 0;
        }


        .hero p {
            font-size: 20px;
            color: #aaa;
        }


        /* Simple section */
        section {
            padding: 80px 10%;
        }


        section h2 {
            font-size: 36px;
        }


        /* Footer */
        footer {
            text-align: center;
            padding: 30px;
            background-color: #181818;
            color: #888;
        }
    </style>
</head>


<body>


    <!-- Navigation -->
    <nav>
        <div class="logo">KC</div>


        <div>
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>




    <!-- Main introduction -->
    <main>
        <div class="hero">
            <h1>My Portfolio</h1>
            <p>Projects, experiments, and things I've built.</p>
        </div>




        <!-- About section -->
        <section id="about">
            <h2>About</h2>
            <p>
                Welcome to my portfolio. This is where I'll document
                the projects I've worked on and things I've built.
            </p>
        </section>




        <!-- Projects section -->
        <section id="projects">
            <h2>Projects</h2>


            <p>
                Project pages will go here.
            </p>
        </section>




        <!-- Contact section -->
        <section id="contact">
            <h2>Contact</h2>


            <p>
                Contact information can go here.
            </p>
        </section>
    </main>




    <!-- Footer -->
    <footer>
        <p>© 2026 KC</p>
    </footer>


</body>
</html>
